; Custom headless target for a classic DOIT ESP32 DevKit V1 with 4 MB flash.
; The connected device was identified as ESP32-D0WD-V3 revision 3.1.

[env:esp32doit-devkit-v1-headless]
extends = env_4mb
board = esp32doit-devkit-v1
board_build.partitions = custom_4Mb_full.csv
custom_firmware_name = BRUCER-LITE-ESP32DOIT
build_src_filter = ${env.build_src_filter} +<../boards/ESP32-Classic>

build_unflags =
    -DBRUCE_VERSION='"dev"'

build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/ESP32-Classic
    -DBRUCE_VERSION='"0.9"'
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/variants/doitESP32devkitV1
    -DLITE_VERSION=1
    -DHAS_OLED_SSD1306=1
    -DUSE_NO_DISPLAY_HAL=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=64
    -DROTATION=0
    -DFP=1
    -DFM=1
    -DFG=1
    -DALLOW_ALL_GPIO_FOR_IR_RF=1

    ; Common DOIT ESP32 DevKit V1 pins. These can be changed later.
    -DGROVE_SDA=21
    -DGROVE_SCL=22
    -DOLED_SDA_PIN=21
    -DOLED_SCL_PIN=22
    -DOLED_ADDRESS=0x3C
    ; Joystick: X34, Y35, button SW25.
    -DJOY_X_PIN=34
    -DJOY_Y_PIN=35
    -DSEL_BTN=25
    -DTXLED=2
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; Shared VSPI bus for optional external RF modules.
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=5

    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=26
    -DCC1101_SS_PIN=5
    -DCC1101_MOSI_PIN=23
    -DCC1101_SCK_PIN=18
    -DCC1101_MISO_PIN=19

    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=27
    -DNRF24_SS_PIN=5
    -DNRF24_MOSI_PIN=23
    -DNRF24_SCK_PIN=18
    -DNRF24_MISO_PIN=19

    -DDEVICE_NAME='"BRUCE LITE STARTERPACK"'

lib_ignore =
    ${env_4mb.lib_ignore}
    TFT_eSPI
    TFT_eSPI QRcode

lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit GFX Library@^1.12.4
    adafruit/Adafruit SSD1306@^2.5.15
