name: Build ESP32 OLED Joystick
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ESP32 DevKit firmware
        run: pio run -e esp32doit-devkit-v1-headless
      - name: Collect binary images
        shell: bash
        run: |
          mkdir -p output
          find .pio/build/esp32doit-devkit-v1-headless -maxdepth 1 -type f -name '*.bin' -exec cp -v {} output/ \;
          find "$HOME/.platformio" -type f -name boot_app0.bin -print -quit | while read -r f; do cp -v "$f" output/boot_app0.bin; done
          ls -lh output/
      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: CyberDeck-ESP32-OLED-Joystick
          path: output/*.bin
          if-no-files-found: error
